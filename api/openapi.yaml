components:
  schemas:
    Organization_Response:
      example:
        instantTranslationCredits: 0.8008281904610115
        name: name
        verifiedTranslationCredits: 6.027456183070403
      properties:
        name:
          description: Name of the organization
          type: string
        instantTranslationCredits:
          description: |
            The amount of credits the organization has remaining
          type: number
        verifiedTranslationCredits:
          description: |
            The amount of credits the organization has remaining
          type: number
      title: Organization Response
      type: object
    New_Organization_Options:
      properties:
        name:
          description: Name to identify the organization by
          type: string
        email:
          description: Contact email for the owner of the organization
          type: string
        registrationMetadata:
          description: |
            Relevant information for the organization being created
          type: object
        instantTranslationCredits:
          description: |
            Amount of credits the organization starts with, usable for
            instant translation jobs
          type: integer
        verifiedTranslationCredits:
          description: |
            Amount of credits the organization starts with, usable for
            verified translation jobs
          type: integer
      title: New Organization Options
      type: object
    Translation_Response:
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        trgLocale: trgLocale
        name: name
        srcLocale: srcLocale
        id: 1
        trgLang: trgLang
        srcLang: srcLang
        status: import_complete
        errorMsg: errorMsg
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          description: |
            This value tracks the status of the delivery.
          enum:
          - import_complete
          - import_failed
          - export_complete
          - export_failed
          - mt_complete
          - mt_failed
          - plugin_complete
          type: string
        srcLang:
          type: string
        srcLocale:
          type: string
        trgLang:
          type: string
        trgLocale:
          type: string
        errorMsg:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - createdAt
      - id
      - name
      - srcLang
      - status
      - trgLang
      - updatedAt
      title: Translation Response
      type: object
    Translations_Response:
      example:
        limit: 0
        start: 6
        results:
        - createdAt: 2000-01-23T04:56:07.000+00:00
          trgLocale: trgLocale
          name: name
          srcLocale: srcLocale
          id: 1
          trgLang: trgLang
          srcLang: srcLang
          status: import_complete
          errorMsg: errorMsg
          updatedAt: 2000-01-23T04:56:07.000+00:00
        - createdAt: 2000-01-23T04:56:07.000+00:00
          trgLocale: trgLocale
          name: name
          srcLocale: srcLocale
          id: 1
          trgLang: trgLang
          srcLang: srcLang
          status: import_complete
          errorMsg: errorMsg
          updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        limit:
          type: integer
        start:
          type: integer
        results:
          items:
            $ref: '#/components/schemas/Translation_Response'
          type: array
      title: Translations Response
      type: object
    Update_Delivery_Options:
      properties:
        status:
          description: |
            This value tracks the status of the delivery.
          enum:
          - import_complete
          - import_failed
          - export_complete
          - export_failed
          - mt_complete
          - mt_failed
          - plugin_complete
          type: string
        error_message:
          type: string
      title: Update Delivery Options
      type: object
    Error_Response:
      example:
        error: Bad Request
        message: Missing query parameter 'name'
        status: 400
      properties:
        error:
          example: Bad Request
          type: string
        message:
          example: Missing query parameter 'name'
          type: string
        status:
          example: 400
          type: integer
      title: Error Response
      type: object
    services_api_credit_transaction_create_credit_transaction_request:
      properties:
        payload:
          type: string
      type: object
    Settings_Response:
      example:
        project_name_template: "{project_prefix} {today}"
        lilt_translation_workflow: INSTANT
        project_prefix: project_prefix
      properties:
        project_prefix:
          description: A string value to include in the Project name.
          type: string
        project_name_template:
          description: |
            The template string to use when generating Project names.

            The available template options are:

            - **today** - Today's date. Formatted as YYYY-MM-DD.
            - **trglocale** - The target locale for the given project.
            - **filename** - The name of the current file being uploaded.
            - **project_prefix** - The project_prefix value provided in the
              configuration.
            - **project_name** - The project_name value assigned to the file in
              the code.
            - **connector_id** - The Connector ID.
            - **connector_type** - The Connector Type (e.g. "xtm", "salesforce").
          example: "{project_prefix} {today}"
          type: string
        lilt_translation_workflow:
          description: |
            This indicates the translation workflow being used. UNKNOWN will only be
            displayed in exceptional cases.
          enum:
          - INSTANT
          - VERIFIED
          - UNKNOWN
          type: string
      title: Settings Response
      type: object
    Jobs_Response:
      example:
        limit: 0
        start: 6
        results:
        - targetLanguages:
          - targetLanguages
          - targetLanguages
          createdAt: 2000-01-23T04:56:07.000+00:00
          dueDate: 2000-01-23T04:56:07.000+00:00
          orderStatus: Draft
          id: 1
          translationWorkflow: INSTANT
          project_prefix: project_prefix
          status: draft
          errorMsg: errorMsg
          updatedAt: 2000-01-23T04:56:07.000+00:00
        - targetLanguages:
          - targetLanguages
          - targetLanguages
          createdAt: 2000-01-23T04:56:07.000+00:00
          dueDate: 2000-01-23T04:56:07.000+00:00
          orderStatus: Draft
          id: 1
          translationWorkflow: INSTANT
          project_prefix: project_prefix
          status: draft
          errorMsg: errorMsg
          updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        limit:
          type: integer
        start:
          type: integer
        results:
          items:
            $ref: '#/components/schemas/Job_Response'
          type: array
      title: Jobs Response
      type: object
    Job_Response:
      example:
        targetLanguages:
        - targetLanguages
        - targetLanguages
        createdAt: 2000-01-23T04:56:07.000+00:00
        dueDate: 2000-01-23T04:56:07.000+00:00
        orderStatus: Draft
        id: 1
        translationWorkflow: INSTANT
        project_prefix: project_prefix
        status: draft
        errorMsg: errorMsg
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          type: integer
        project_prefix:
          type: string
        status:
          description: |
            This value tracks the async processing status of the job.
          enum:
          - draft
          - queued
          - processing
          - complete
          - canceled
          - failed
          type: string
        orderStatus:
          description: |
            This value tracks the completion status of the translation order.
          enum:
          - Draft
          - Started
          - In Progress
          - Delivered
          - Complete
          - Needs Attention
          type: string
        targetLanguages:
          items:
            type: string
          type: array
        translationWorkflow:
          description: |
            This indicates the translation workflow being used. UNKNOWN will only be
            displayed in exceptional cases.
          enum:
          - INSTANT
          - VERIFIED
          - UNKNOWN
          type: string
        dueDate:
          format: date-time
          type: string
        errorMsg:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      title: Job Response
      type: object
    Update_Job_Options:
      properties:
        status:
          description: |
            This value tracks the async processing status of the job.
          enum:
          - draft
          - queued
          - processing
          - complete
          - canceled
          - failed
          type: string
        error_message:
          type: string
        source_word_count:
          type: number
      title: Update Job Options
      type: object
    New_Job_Options:
      properties:
        project_prefix:
          description: A string value to include in the Project name.
          type: string
        project_name_template:
          description: |
            The template string to use when generating Project names.

            The available template options are:

            - **today** - Today's date. Formatted as YYYY-MM-DD.
            - **trglocale** - The target locale for the given project.
            - **filename** - The name of the current file being uploaded.
            - **project_prefix** - The project_prefix value provided in the
              configuration.
            - **project_name** - The project_name value assigned to the file in
              the code.
            - **connector_id** - The Connector ID.
            - **connector_type** - The Connector Type (e.g. "xtm", "salesforce").
          example: "{project_prefix} {today}"
          type: string
        lilt_translation_workflow:
          enum:
          - INSTANT
          - VERIFIED
          type: string
        lilt_default_due_date:
          description: |
            The due date to use when creating Lilt Jobs/Projects if no specific due
            date is specified on the file level.
          type: string
        lilt_target_languages:
          description: |
            The list of target languages to use for the new job. The values provided
            should be present in the target_memories section of the configuration.
          items:
            type: string
          type: array
        handle_credit_transactions:
          default: false
          description: |
            If true, credit transactions will be handled by the connector. If false,
            no credit transactions will be created for the job.
          type: boolean
        source_word_count:
          description: |
            The source word count to use when creating credits transaction for
            instant transaltion jobs.
          type: number
      title: New Job Options
      type: object
    Preview_Translation_Response_inner:
      example:
        source: source
        key: key
        target: target
      properties:
        key:
          description: The key of the content field.
          type: string
        source:
          description: The source content of the field.
          type: string
        target:
          description: The target content of the field.
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
      x-bearerInfoFunc: services.api.auth.api_key_auth

