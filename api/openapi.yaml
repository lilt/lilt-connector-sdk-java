  /credit-transaction:
    post:
      operationId: services.api.credit_transaction.create_credit_transaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services_api_credit_transaction_create_credit_transaction_request'
      responses:
        "204":
          description: |
            Upon success a response with an empty body is returned.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_Response'
          description: The Bad Request response.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_Response'
          description: The Unauthorized response.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_Response'
          description: The Forbidden response.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_Response'
          description: The Server Error response.
      security: []
      summary: |
        Create a credit transaction. Request is expected to contain credits
        information encoded in jwt_token payload. Request encoded should have
        info for instant_translation_credits_change value,
        verified_translation_credits_change value, source_metadata which
        contains any identifying information to attach to the transaction,
        email for the user starting the transaction, and optionally lilt_token
        for the connector configuration.
      tags:
      - Credit Transactions
      x-content-type: application/json
      x-accepts:
      - application/json
